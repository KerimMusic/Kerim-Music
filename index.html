<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Canción - Kerim Music</title>
  <link rel="stylesheet" href="subir-styles.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎵 Subir Canción</h1>
      <p>Kerim Music</p>
    </div>

    <!-- Estado del usuario -->
    <div id="userBox" class="user-box hidden">
      <span class="dot"></span>
      <span id="userEmail">Cargando...</span>
    </div>

    <!-- Botón login si no está autenticado -->
    <button id="loginBtn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Iniciar sesión con Google
    </button>

    <!-- Formulario -->
    <form id="formCancion" class="hidden">
      <div class="form-group">
        <label for="artista">1. Nombre del artista</label>
        <input type="text" id="artista" placeholder="Ej: Bad Bunny" required>
      </div>

      <div class="form-group">
        <label for="titulo">2. Título de la canción</label>
        <input type="text" id="titulo" placeholder="Ej: Dile Barrio Bajo" required>
      </div>

      <div class="form-group">
        <label for="audio">3. Link de audio (Dropbox)</label>
        <input type="url" id="audio" placeholder="https://www.dropbox.com/s/.../cancion.mp3?dl=0" required>
        <p class="hint">Pega el link normal de Dropbox. Se convertirá automáticamente a enlace directo.</p>
      </div>

      <div class="form-group">
        <label for="imagen">4. Link de imagen (Dropbox)</label>
        <input type="url" id="imagen" placeholder="https://www.dropbox.com/s/.../portada.jpg?dl=0">
        <p class="hint">Opcional. Si lo dejas vacío se mostrará una imagen por defecto.</p>
      </div>

      <!-- Vista previa -->
      <div id="preview" class="preview">
        <img id="previewImg" src="" alt="">
        <div class="preview-info">
          <strong id="previewTitulo">—</strong>
          <small id="previewArtista">—</small>
        </div>
      </div>

      <button type="submit" id="submitBtn">Subir canción</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script type="module" src="subir-script.js"></script>
</body>
</html>
